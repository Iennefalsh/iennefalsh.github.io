<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>Forms</title>
</head>
<body>
	<form>
		<!--Elemen input type text-->
		<label for="name">Nama Lengkap</label><br>
		<input type="text" name="name" id="name" required placeholder="Masukkan nama lengkap">
		<br>
		<label for="nim">NIM</label><br>
		<input type="text" name="nim" id="nim" required placeholder="Masukkan NIM">
		<br>
		<label for="email">Email</label><br>
		<input type="text" name="email" id="email" required placeholder="Masukkan email">
		<br>
		<!--Elemen input type radio-->
		<label>Jenis Kelamin</label><br>
		<input type="radio" id="laki" name="kelamin" value="laki">
		<label for="laki">Laki-laki</label>
		<input type="radio" id="perempuan" nama="kelamin" value="perempuan">
		<label for="perempuan">Perempuan</label>
		<br>
		
		<!--Elemen section dan option-->
		<label for="prodi">Program Studi</label><br>
		<select name="prodi" id="prodi">
			<option value="informatika">Teknik Informatika</option>
			<option value="elektro">Teknik Elektro</option>
			<option value="manajemen">Manajemen Bisnis</option>
		</select>
		<br>
		<!--Elemen textarea-->
		<label for="alamat">Alamat</label><br>
		<textarea name="alamat" id="alamat" cols="30" rows="10"></textarea>
		<br>
		<!--Elemen button-->
		<button type="submit">Submit</button>
	</form>
</body>
</html>
